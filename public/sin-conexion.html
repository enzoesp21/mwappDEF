<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#516d5c" />
    <title>Sin conexión · Waikiki</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #dbd2b5;
        color: #1f2a24;
        font-family: Poppins, 'Segoe UI', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 96px; height: auto; opacity: 0.85; }
      h1 { color: #516d5c; font-size: 22px; margin: 16px 0 6px; }
      p { margin: 0 0 20px; color: #5b6560; font-size: 15px; line-height: 1.5; }
      button {
        background: #516d5c;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font: 600 13px/1 inherit;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Mirador Waikiki" />
      <h1>Sin conexión</h1>
      <p>Revisá el wifi o los datos del celular y volvé a intentar.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
